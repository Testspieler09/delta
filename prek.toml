[[repos]]
repo = "local"

  [[repos.hooks]]
  id = "cargo-check"
  name = "cargo check"
  entry = "cargo check --all-targets"
  language = "system"
  pass_filenames = false

  [[repos.hooks]]
  id = "cargo-test"
  name = "cargo test"
  entry = "cargo test --all"
  language = "system"
  pass_filenames = false
