[package]
name = "delta"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.56", features = ["derive"] }
csv = "1.4.0"
humantime-serde = "1.1.1"
nix = { version = "0.31.1", features = ["resource", "process"] }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
sysinfo = "0.38.0"
toml = "0.9.11"
wait-timeout = "0.2.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[dev-dependencies]
tempfile = "3.25.0"
